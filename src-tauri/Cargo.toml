[package]
name = "one-click-launcher"
version = "2.0.0"
description = "Modern Windows multi-app launcher"
authors = ["One Click Launcher"]
edition = "2021"

[lib]
name = "one_click_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "one-click-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
tauri = { version = "=2.8.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
winreg = "0.55"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Storage_FileSystem"] }
rfd = "0.15"
# Keep transitive web/config crates compatible with the installed Rust 1.85 toolchain.
serde_with = "=3.12.0"
time = "=0.3.41"
plist = "=1.7.0"
idna = "=1.0.3"
idna_adapter = "=1.1.0"
tauri-runtime = "=2.9.2"
wry = "=0.53.4"
